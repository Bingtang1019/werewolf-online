<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐺</text></svg>">
<title>狼人杀 · 在线版</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 首页：创建 / 进入房间 -->
<div id="home">
  <div class="moon" aria-hidden="true"></div>
  <div class="cloud c1" aria-hidden="true"></div>
  <div class="cloud c2" aria-hidden="true"></div>
  <div class="cloud c3" aria-hidden="true"></div>
  <div class="home-box">
    <h1>🐺 狼人杀</h1>
    <p class="sub">和朋友们一起玩（4~18 人 · 纯网页 · 零安装）</p>
    <div class="nick-line">
      <input id="in-name" placeholder="输入你的昵称" maxlength="12" autocomplete="off">
      <button id="btn-nick-shuffle" class="mini" title="换个昵称" aria-label="换个昵称">🎲</button>
    </div>
    <div id="last-room" class="hidden"><button id="btn-last-room"></button></div>
    <div class="action-grid">
      <div class="action-card" id="card-create" role="button" tabindex="0" aria-label="创建房间">
        <div class="ac-icon">🚪</div>
        <div class="ac-title">创建房间</div>
        <div class="ac-desc">生成房号，发给朋友</div>
      </div>
      <div class="action-card" id="card-join">
        <div class="ac-icon">🎯</div>
        <div class="ac-title">加入房间</div>
        <div class="ac-desc">输入 6 位房间号</div>
        <div class="join-line">
          <input id="in-code" placeholder="如 3F7KQZ" maxlength="6" autocomplete="off">
          <button id="btn-join-go" class="primary mini">进入</button>
        </div>
      </div>
    </div>
    <div class="offline-line"><button id="btn-offline" class="mini">🎮 离线模式（单机 · 智能人机）</button></div>
  <div id="home-err" class="err"></div>
    <div id="stats-line" class="stats-line hidden" role="status">🔥 当前 <b id="stats-rooms">0</b> 个房间正在开黑</div>
    <div class="lm-toggle-row">
      <label class="lm-toggle"><input type="checkbox" id="in-less-motion"> ✨ 减少动效</label>
      <span class="font-scale" title="界面字号">
        <button class="mini" onclick="setFontScale(0)">A-</button>
        <button class="mini" onclick="setFontScale(1)">A</button>
        <button class="mini" onclick="setFontScale(2)">A+</button>
      </span>
    </div>
    <details id="rules-view" class="hidden"><summary>📖 规则速览</summary><div id="rules-list"></div></details>
    <div class="home-foot">
      <span>🐺 狼人杀在线版</span><span class="dot">·</span><span>v1.7.3</span><span class="dot">·</span><span>零依赖 · 公网可玩</span>
    </div>
  </div>
</div>

<!-- 游戏界面 -->
<div id="room" class="hidden">
  <div id="topbar">
    <div class="tb-left">
      <span class="room-code" id="room-code"></span>
      <button id="btn-copy" class="mini" title="复制邀请链接">复制</button>
      <button id="btn-share" class="mini" title="分享邀请链接">📤</button>
    </div>
    <div class="tb-mid">
      <span id="phase-text" class="phase-text"></span>
      <span id="day-text"></span>
      <span id="phase-countdown" class="countdown"></span>
    </div>
    <div class="tb-right">
      <span id="my-role-chip"></span>
      <div class="sound-wrap">
        <button id="btn-sound" class="mini" title="声音设置（总开关，点击展开）">🔊</button>
        <div id="sound-pop" class="hidden">
          <div class="sp-title">🔊 声音设置</div>
          <label class="sp-row"><input type="checkbox" id="sp-master"> 音效总开关</label>
          <label class="sp-row"><input type="checkbox" id="sp-wolf"> 🐺 狼嚎</label>
          <label class="sp-row"><input type="checkbox" id="sp-morning"> 🌅 天亮和弦</label>
          <label class="sp-row"><input type="checkbox" id="sp-tick"> 🗳️ 投票滴答</label>
          <label class="sp-row"><input type="checkbox" id="sp-heavy"> 💥 重击/死亡</label>
          <label class="sp-row"><input type="checkbox" id="sp-flip"> 🎴 翻牌</label>
          <label class="sp-row"><input type="checkbox" id="sp-enter"> 🔔 入场铃</label>
          <label class="sp-row"><input type="checkbox" id="sp-tts"> 🔊 上帝配音（夜晚播报）</label>
        </div>
      </div>
      <button id="btn-chat-open" class="mini hidden" title="打开聊天">💬 聊天</button>
      <button id="btn-force" class="mini hidden" title="房主强制继续：未操作者视为弃权/跳过">强制继续</button>
      <button id="btn-leave" class="mini">离开</button>
    </div>
    <div id="breadcrumb"></div>
    <div id="phase-bar"><div id="phase-bar-fill"></div></div>
  </div>

  <div id="main">
    <div id="left">
      <div id="players"></div>
      <div id="info"></div>
      <div id="panel"></div>
    </div>
    <div id="right">
      <div id="chat-tabs"></div>
      <div id="chat-msgs"></div>
      <div id="quick-phrases" class="hidden"></div>
      <div id="chat-input-row">
        <input id="chat-text" maxlength="200" placeholder="说点什么…" autocomplete="off">
        <button id="btn-chat">发送</button>
      </div>
    </div>
  </div>
</div>

<!-- 夜晚/天亮过渡遮罩 -->
<div id="overlay-night" class="hidden">
  <div class="on-title">🌙 第 <span id="on-night-num">1</span> 夜</div>
  <div class="on-sub">天黑请闭眼，请等待各位行动…</div>
  <div class="on-card">
    <div class="oc-role" id="on-card-emoji"></div>
    <div class="oc-title" id="on-card-title">你是：？</div>
    <div class="on-deaths" id="on-deaths"></div>
    <div class="btn-row"><button id="on-close" class="primary">开始行动</button></div>
  </div>
</div>

<div id="net-banner" class="hidden" role="status">⚠️ 连接中断，正在重试…</div>
<!-- 创建成功：房间号大卡过渡（1.5s 自动进入房间） -->
<div id="overlay-created" class="hidden">
  <div class="cr-card">
    <div class="cr-title">🎉 房间已创建</div>
    <div class="cr-code" id="cr-code"></div>
    <button id="btn-copy-code" class="primary">📋 复制房间号</button>
    <div class="cr-progress"><div class="cr-bar" id="cr-bar"></div></div>
    <div class="cr-hint" id="cr-hint">1.5 秒后自动进入房间…</div>
  </div>
</div>
<div id="toast" class="hidden" role="status" aria-live="polite"></div>
<!-- 身份大卡弹窗（点顶栏身份芯片展开） -->
<div id="role-pop" class="hidden">
  <div class="rp-card"><div class="rp-emoji" id="rp-emoji"></div><div class="rp-name" id="rp-name"></div><div class="rp-desc" id="rp-desc"></div></div>
</div>
<script src="client.js"></script>
</body>
</html>
